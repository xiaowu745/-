services:
  app:
    build: .
    container_name: skill-agent
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./skill_agent.db:/app/skill_agent.db
    env_file:
      - .env
    environment:
      - DATABASE_URL=sqlite:///./skill_agent.db
      - DEBUG=false
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
